packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
overrides:
  # better-call@1.4.0 pide @better-auth/utils@^0.5.0, que no está publicado (la
  # última es 0.4.2), así que instalar better-auth falla. 1.3.7 es la que resuelve
  # gym y funciona. Se puede quitar cuando publiquen la 0.5.
  better-call: 1.3.7
